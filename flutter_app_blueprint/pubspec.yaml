name: receipt_scanner_app
description: "AI Mobile Receipt Scanner with Google Drive, Sheets Sync, and A4 Compiler"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner: ^0.3.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.0
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
