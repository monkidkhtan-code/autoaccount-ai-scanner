services:
  - type: web
    name: autoaccount-ai-scanner
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
